tasks:
  - id: demo-task
    title: "Demo task for bootstrap"
    repo_path: "."
    base_branch: "main"
    work_branch: "ai/demo-task"
    goal: "Add a simple console log to demonstrate the orchestrator pipeline."
    context_files:
      - "package.json"
      - "tsconfig.json"
    checks:
      - command: "npm"
        args: ["run", "build"]
    guardrails:
      deny_modify:
        - ".env"
        - ".env.*"
        - "node_modules/**"
        - ".git/**"
      max_lines_changed: 150
      require_tests: false
      auto_commit: false
      auto_push: false
      auto_merge: false

  - id: smoke-demo
    title: "AI smoke demo"
    repo_path: "."
    base_branch: "main"
    work_branch: "ai/smoke-demo"
    goal: "Write one short line into smoke-demo/ai-smoke.txt. Do not touch any other files."
    context_files: []
    checks:
      - command: "node"
        args: ["-e", "const fs=require('fs'); const c=fs.readFileSync('smoke-demo/ai-smoke.txt','utf8'); if(!c.trim()) process.exit(1);"]
    guardrails:
      allow_modify:
        - "smoke-demo/ai-smoke.txt"
      deny_modify:
        - ".env"
        - ".env.*"
        - "node_modules/**"
      max_lines_changed: 10
      require_tests: false
      auto_commit: false
      auto_push: false
      auto_merge: false
