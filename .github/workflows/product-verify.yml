name: Product verification

on:
  workflow_dispatch:

jobs:
  verify-product:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity for temp repo tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI User"

      - name: Verify product (CI-safe chunks)
        run: npm run verify:product:ci

      - name: Upload chunk outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-outputs
          path: tmp/chunk-outputs/
          retention-days: 7
